name: 🐛 Bug report
description: Report broken behavior in the engine — storefront, admin, API, or build
labels: [bug, needs-triage]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what's broken.
      placeholder: When I do X, Y happens, but I expected Z.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where is the bug?
      options:
        - Storefront (pages, cart, checkout)
        - Admin (/admin)
        - API / tool surface (/api/v1/tools, /api/mcp, feeds)
        - Design packs / themes
        - Database / Prisma
        - Build / dev server
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `npx create-cartwright@latest my-shop`
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: Engine version
      description: From `.cartwright/release.json` in your project, or the tag you scaffolded from.
      placeholder: e.g. v0.45.0
  - type: input
    id: profile
    attributes:
      label: Scaffold profile
      description: From `.cartwright/profile.json`, if present.
      placeholder: light / full / site
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: e.g. v22.11.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 / Ubuntu 24.04 / Windows 11 WSL2
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Terminal output, browser console, or server logs. Redact secrets.
      render: shell
