# pnpm 11+ moved the `onlyBuiltDependencies` setting out of package.json.
# This file is the new home. Each entry here is a package whose install
# scripts we explicitly trust to run.
#
# All entries below are legitimate native/codegen deps the project
# actually needs: Prisma (DB client codegen), sharp (Next.js image
# optimisation), Sentry CLI (release-tracking), Google Gemini SDK,
# @swc/core + @parcel/watcher (build tooling pulled in transitively
# by Next.js + tsx), protobufjs (transitive), unrs-resolver (turbo
# native-resolver bridge).
#
# Conservative principle: only add a package here if you can name why
# the project depends on it. Unknown native postinstalls remain blocked.
# Security overrides: force-patch transitive deps onto their patched lines.
# undici: @vercel/blob (prod) pins undici ^6.23.0 → push the 6.x copy to
# >=6.27.0; jsdom/vitest pull the 7.x copy → push it to >=7.28.0. See pnpm
# audit advisory GHSA-g8m3-5g58-fq7m (and the WebSocket/Set-Cookie batch).
# postcss: next still bundles postcss <8.5.10 (transitive, build-time only)
# → push it to the patched line. Advisory GHSA-qx2v-qp2m-jg93 (XSS via
# unescaped </style>). Drop once next ships postcss >=8.5.10.
# 2026-09-14 batch (pnpm audit --prod: 8 high + 6 moderate — thirteen transitive,
# plus the direct js-yaml, which package.json moves to ^4.3.2):
# fast-uri: ajv (via @modelcontextprotocol/sdk, prod, and the prisma CLI's
#   @prisma/dev) resolves <3.1.6 →
#   GHSA-5jgf-p345-68v8, -f65p-4m7j-42xc, -fph4-wmhf-6fwf, -jqff-g426-hqxp.
# sharp: next's optional image optimiser → GHSA-rgj7-g3m4-5g8c (libheif).
# qs + hono: express/@hono/node-server under @modelcontextprotocol/sdk →
#   GHSA-x5fp-wj9c-mxmx, -4mjr-xmp4-gh2g (qs); GHSA-gqvv-2mrq-wpjv,
#   -g6gw-c38x-mqfc, -crvj-82cr-hjcx (hono).
# mysql2 + deepmerge-ts: pinned exactly by the prisma CLI (mysql2 3.15.3,
#   used only against a MySQL database; @prisma/config → deepmerge-ts 7.1.5,
#   used when it reads prisma.config.ts); never the runtime client →
#   GHSA-3f6p-5ww8-9rcr, -rgwj-5xj2-c3m3 (mysql2), GHSA-ggr8-5vv4-36mx
#   (deepmerge-ts, fixed only in 8.x — the one cross-major selector;
#   @prisma/config uses nothing but the `deepmerge` export, via a dynamic
#   import(), and 8.x keeps it).
# js-yaml: the direct (production) dependency moves to ^4.3.2 in package.json;
#   this selector closes the second copy, which @eslint/eslintrc installs as a
#   dev-only dependency (GHSA-2883-xcg3-v3hh) — every scaffold installs it too.
#   (vite 8.0.x under vitest is a peer, which an override cannot move; it
#   leaves with the next vitest bump.)
# 2026-09-30 batch (CW-2026-005; pnpm audit --prod: 5 high + 12 moderate + 5 low):
# undici: both selectors above move up a line — 6.x to >=6.28.1, 7.x to >=7.29.1
#   The 6.x copy (@vercel/blob) carries three: GHSA-rfgv-xxqx-mfg5 and
#   -3wwx-pv8p-q78v (WebSocket) and -r53p-7pc4-xj5r (retry interceptor). The 7.x
#   copy (jsdom) carries those plus GHSA-w293-vg96-wgc3 (TLS validation in
#   BalancedPool) and the -pmjh/-3xpg/-2jfj/-rx4f/-2gqq/-8436 batch.
# fast-uri: >=3.1.8 (GHSA-hrr3-gc8f-f4qj), same ajv paths as the batch above.
# ip-address: express-rate-limit under @modelcontextprotocol/sdk (via
#   @google/genai) → GHSA-rpw4-54j3-4h4q, -2vr4-cq9g-pvrc, -j6r3-76f7-8jcv,
#   -h3mg-xc3c-68pw.
# brace-expansion: minimatch under @sentry/bundler-plugin-core (build time) →
#   GHSA-6j4f-fj2g-mc7p, -qhr7-859c-m2p7, -q2hr-2g5m-vwhr. The 1.x copy that
#   older minimatch lines pull is not in these ranges and is left alone.
# Every version here is older than the three-day cooldown below.
# Drop each once its parent ships the patched line itself.
# Supply-chain cooldown: pnpm refuses a version published less than three days
# (4320 minutes) ago. A compromised release is usually caught and pulled within
# days, so "newest" here means the newest version that has been public for three
# days. pnpm 11 applies it when it resolves a version (add, update, an install
# without a lockfile) AND when it installs from a lockfile — an entry younger than
# the cutoff fails the install, frozen or not. An entry only ages, so a lockfile
# resolved under this rule keeps passing. A security fix that cannot wait three
# days goes in minimumReleaseAgeExclude, with its advisory next to it.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # next 16.3.8 fixes GHSA-cjq9-62q9-8jv4 (high: server-side request forgery in
  # Image Optimization — next.config.ts sets images.remotePatterns, so a shop
  # serves /_next/image) plus five medium advisories (GHSA-f87g-xv8r-7p7x,
  # -4jqv-mc3x-m676, -mcj8-r9mp-w47p, -3w37-wq28-93x7, -h694-7cp9-m8p3) and one
  # low (-39w2-rjm5-chcv, dev server only); CW-2026-006. It was published
  # 2026-09-30, too young for the cutoff above. These are the release and the
  # exact versions it pins; drop them once 16.3.8 is older than three days
  # (after 2026-10-03 16:08 UTC; next itself was published 16:07:21). The 16.3.6 entries (CW-2026-004) are gone:
  # that release is older than three days.
  - next@16.3.8
  - eslint-config-next@16.3.8
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'

overrides:
  'undici@>=6.0.0 <6.28.1': '^6.28.1'
  'undici@>=7.0.0 <7.29.1': '^7.29.1'
  'postcss@<8.5.10': '^8.5.10'
  'fast-uri@>=3.0.0 <3.1.8': '^3.1.8'
  'sharp@>=0.35.0 <0.35.4': '^0.35.4'
  'qs@>=6.0.0 <6.16.0': '^6.16.0'
  'hono@>=4.0.0 <4.13.5': '^4.13.5'
  'mysql2@>=3.0.0 <3.23.1': '^3.23.1'
  'deepmerge-ts@>=7.0.0 <8.0.0': '^8.0.0'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'ip-address@>=10.0.0 <10.7.1': '^10.7.1'
  'brace-expansion@>=5.0.0 <5.0.12': '^5.0.12'

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
